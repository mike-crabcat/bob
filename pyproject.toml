[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bob"
version = "0.4.13"
description = "Bob — data service, agent harness, CLI, and dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Mike Cleaver" },
]
dependencies = [
  "aiosqlite>=0.20.0",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "pillow>=12.2.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.18",
  "python-jose>=3.3.0",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
  "websockets>=15.0.0",
  "openai>=1.0.0",
  "sqlite-vec>=0.1.6",
  "twilio>=9.0.0",
  "soundfile>=0.13.1",
  "numpy>=2.0.0",
  "av>=14.0.0",
  "qrcode>=8.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.3.0",
  "pytest-timeout>=2.4.0",
  "pytest-cov>=6.0",
]

[project.scripts]
bob = "server.cli:app"

# Minimal build config: the project installs editable so the `bob` entry
# point exists in the venv. Not distributed as a package — Docker is the
# distribution channel (see docs/bob-docker-plan.md).
[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "openclaw_live: exercises a real OpenClaw gateway/model and is skipped by default",
]
