<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bob — Voice</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
        body { margin: 0; padding: 24px 16px; font-family: system-ui, -apple-system, sans-serif; color: #eee; background: #15131a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .card { max-width: 480px; width: 100%; }
        h1 { font-size: 1.25rem; margin: 0 0 4px; text-align: center; }
        .sub { color: #9a93a8; font-size: 0.85rem; text-align: center; margin-bottom: 24px; }
        #status { margin: 16px 0; padding: 12px 14px; border-radius: 10px; background: #221f2a; font-size: 0.9rem; text-align: center; min-height: 20px; }
        #status.connected { color: #5ad15a; }
        #status.error { color: #e94560; }
        #transcript { background: #1c1924; border-radius: 12px; padding: 16px; min-height: 120px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; margin: 12px 0; }
        .cap-label { font-size: 0.7rem; color: #9a93a8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
        button { width: 100%; border: none; border-radius: 999px; padding: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 12px; }
        #connect { background: #e94560; color: white; }
        #connect:disabled { opacity: 0.5; }
        #hangup { background: #34303f; color: #eee; display: none; }
        .pulse { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div class="card">
<h1>Bob</h1>
<div class="sub">Voice call</div>
<div id="status">Tap to start</div>
<div id="transcript" style="display:none"></div>
<button id="connect">Connect</button>
<button id="hangup">Hang up</button>
</div>
<script src="realtime_audio.js"></script>
<script src="session.js"></script>
</body>
</html>
